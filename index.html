<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pavillon Noir 2 - Gestion des Actions de Groupe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Pavillon Noir 2 - Gestion des Actions de Groupe</h1>

    <!-- 1. TESTS D'OPPOSITION & ACTIONS NUMERIQUES -->
    <div class="section">
        <h2>1. Résolution d'Action & Opposition</h2>
        <p style="font-size: 0.85em; text-align: center;">Entrez les succès des deux camps et la mesure initiale pour appliquer automatiquement la table.</p>
        
        <div class="grid-3">
            <div>
                <label for="succesJoueurs">Succès Joueurs :</label>
                <input type="number" id="succesJoueurs" value="3" min="0" oninput="resoudreOpposition()">
            </div>
            <div>
                <label for="succesAdverses">Succès Adversaires :</label>
                <input type="number" id="succesAdverses" value="1" min="0" oninput="resoudreOpposition()">
            </div>
            <div>
                <label for="mesureInitiale">Mesure Initiale (ex: 30) :</label>
                <input type="number" id="mesureInitiale" value="30" step="any" min="0.01" oninput="resoudreOpposition()">
            </div>
        </div>

        <div class="result-box" id="resultatOpposition"></div>
    </div>

    <!-- 2. SIMULATEUR DE TEST DE GROUPE (CORRIGÉ & COMPLET) -->
    <div class="section">
        <h2>2. Simulateur de Test de Groupe</h2>
        <div class="grid-2">
            <div>
                <label for="niveauMatelots">Niveau des Matelots :</label>
                <select id="niveauMatelots" onchange="calculerTestGroup()">
                    <option value="-3">0 : Parfait profane (Modif: -3)</option>
                    <option value="-2">1 : Novice (Modif: -2)</option>
                    <option value="-1">2 : Apprenti (Modif: -1)</option>
                    <option value="0" selected>3 : Professionnel (Modif: 0)</option>
                    <option value="1">4 : Expert (Modif: +1)</option>
                    <option value="2">5 : Maître (Modif: +2)</option>
                    <option value="3">6+ : Légende vivante (Modif: +3)</option>
                </select>
            </div>
            <div>
                <label for="typeAction">Type d'Action de Groupe :</label>
                <select id="typeAction" onchange="changerAction()">
                    <option value="artillerie">Artillerie</option>
                    <option value="combat">Combat et Tir</option>
                    <option value="habilete">Habileté (Terriens)</option>
                    <option value="manoeuvre" selected>Manœuvre (Marins)</option>
                    <option value="recharge">Recharge</option>
                    <option value="ruse">Ruse / Subterfuge</option>
                </select>
            </div>
        </div>

        <!-- Les champs des officiers s'injectent dynamiquement ici -->
        <div id="zoneOfficiers"></div>

        <div class="result-box" id="resultatTest"></div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
